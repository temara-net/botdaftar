name: botdaftar

# Model batch sesuai konsep: bot TIDAK siaga 24 jam. Tiap run mengambil
# pesan Telegram terbaru dari pemilik, memprosesnya (termasuk menjalankan
# pendaftaran bila alur sudah lengkap), menyimpan state, lalu selesai.
# PENTING: repo ini PUBLIK — state (memuat ID Telegram pemilik) TIDAK
# boleh masuk Git. State disimpan di cache Actions (privat), bukan commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: botdaftar
  cancel-in-progress: false

jobs:
  jalan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        run: |
          pip install -r daftar/requirements.txt
          playwright install --with-deps chromium

      - name: Ambil state dari cache privat (bukan dari Git)
        uses: actions/cache@v4
        with:
          path: state/state.json
          key: botdaftar-state-${{ github.run_id }}
          restore-keys: |
            botdaftar-state-

      - name: Jalankan bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          STATE_PATH: state/state.json
          EXECUTOR: browser
        run: python -m daftar.bot

      # State TIDAK dikomit ke repo (repo publik). actions/cache di atas
      # menyimpannya otomatis di akhir job ke cache privat Actions.
